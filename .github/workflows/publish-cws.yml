name: Publish to Chrome Web Store

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      publish:
        description: "Move the upload to public (publish) instead of leaving as draft"
        type: boolean
        default: false

jobs:
  publish:
    name: Upload to Chrome Web Store
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Chrome extension
        run: npm run build

      - name: Zip Chrome build
        run: |
          cd dist/chrome
          zip -r ../chrome.zip .

      - name: Install Chrome Web Store CLI
        run: npm install -g chrome-webstore-upload-cli@3

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: chrome-webstore-upload upload --source dist/chrome.zip

      - name: Publish to Chrome Web Store
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: chrome-webstore-upload publish
