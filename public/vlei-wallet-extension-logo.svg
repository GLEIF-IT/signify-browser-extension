<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">vLEI Wallet Logo</title>
  <desc id="desc">A modern vLEI wallet browser extension logo combining a shield, wallet, key, and connected identity nodes.</desc>

  <defs>
    <linearGradient id="bg" x1="80" y1="64" x2="432" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="card" x1="130" y1="145" x2="390" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>

    <filter id="softShadow" x="40" y="40" width="432" height="432" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Rounded extension icon background -->
  <rect x="56" y="56" width="400" height="400" rx="104" fill="url(#bg)"/>

  <!-- Subtle identity network -->
  <g opacity="0.24" stroke="#E0F2FE" stroke-width="8" stroke-linecap="round">
    <path d="M132 159L205 118L285 142L372 111"/>
    <path d="M118 353L193 300L279 328L388 281"/>
    <path d="M151 161L197 301"/>
    <path d="M285 142L279 328"/>
  </g>
  <g fill="#E0F2FE" opacity="0.42">
    <circle cx="132" cy="159" r="14"/>
    <circle cx="205" cy="118" r="12"/>
    <circle cx="285" cy="142" r="12"/>
    <circle cx="372" cy="111" r="14"/>
    <circle cx="118" cy="353" r="12"/>
    <circle cx="193" cy="300" r="14"/>
    <circle cx="279" cy="328" r="12"/>
    <circle cx="388" cy="281" r="14"/>
  </g>

  <!-- Shield / trust container -->
  <g filter="url(#softShadow)">
    <path d="M256 104L374 151V248C374 323 326 390 256 414C186 390 138 323 138 248V151L256 104Z" fill="#F8FAFC"/>
    <path d="M256 126L352 164V248C352 308 314 361 256 384C198 361 160 308 160 248V164L256 126Z" fill="url(#card)"/>
  </g>

  <!-- Wallet body -->
  <rect x="166" y="197" width="194" height="124" rx="31" fill="#0F172A"/>
  <path d="M193 197H327C345.225 197 360 211.775 360 230V235H218C190.386 235 168 257.386 168 285V230C168 211.775 182.775 197 201 197H193Z" fill="#1E293B"/>
  <rect x="262" y="236" width="98" height="66" rx="23" fill="#2563EB"/>
  <circle cx="304" cy="269" r="12" fill="#E0F2FE"/>

  <!-- Key / signing symbol -->
  <g stroke="#F8FAFC" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="219" cy="266" r="27"/>
    <path d="M246 266H302"/>
    <path d="M280 266V289"/>
    <path d="M304 266V284"/>
  </g>

  <!-- vLEI wordmark -->
  <text x="256" y="365" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="56" font-weight="800" letter-spacing="-1.5" fill="#0F172A">vLEI</text>
</svg>
